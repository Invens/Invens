<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg{fill:#0d1117}.panel{fill:#11161d}.border{stroke:#30363d}.primary{fill:#f0f6fc}.muted{fill:#8b949e}.soft{fill:#6e7681}.signal{stroke:#56d364}.signalFill{fill:#56d364}
    @media (prefers-color-scheme: light){.bg{fill:#ffffff}.panel{fill:#f6f8fa}.border{stroke:#d0d7de}.primary{fill:#1f2328}.muted{fill:#59636e}.soft{fill:#818b98}.signal{stroke:#1f883d}.signalFill{fill:#1f883d}}
  </style>
  <rect width="1200" height="360" rx="14" class="bg"/>
  <rect x="1" y="1" width="1198" height="358" rx="13" fill="none" class="border"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="48" y="48" class="muted" font-size="13">I rarely stay in one layer.</text>

    <text x="48" y="118" class="primary" font-size="43" font-weight="700">I build products until I understand</text>
    <text x="48" y="169" class="primary" font-size="43" font-weight="700">the system behind them.</text>

    <text x="50" y="212" class="muted" font-size="17">browser · mobile · backend · data · deployment · applied AI</text>

    <path d="M50 282H270L286 282L294 280L302 284L310 282L318 282L326 262L334 307L342 235L350 285L359 269L368 282H661" fill="none" class="signal" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="665" cy="282" r="4" class="signalFill"/>
    <text x="683" y="287" class="muted" font-size="13">follow a thread below</text>

    <rect x="770" y="38" width="382" height="284" rx="11" class="panel"/>
    <rect x="770.5" y="38.5" width="381" height="283" rx="10.5" fill="none" class="border"/>

    <text x="800" y="76" class="soft" font-size="11" font-weight="600" letter-spacing="1.1">QUESTIONS I KEEP COMING BACK TO</text>

    <circle cx="805" cy="121" r="3" class="signalFill"/>
    <text x="820" y="126" class="primary" font-size="16">Can browser context be useful</text>
    <text x="820" y="148" class="muted" font-size="14">without becoming invasive?</text>

    <circle cx="805" cy="191" r="3" class="signalFill"/>
    <text x="820" y="196" class="primary" font-size="16">Can a smaller model route work</text>
    <text x="820" y="218" class="muted" font-size="14">across larger specialized models?</text>

    <circle cx="805" cy="261" r="3" class="signalFill"/>
    <text x="820" y="266" class="primary" font-size="16">Can generated graphics stay</text>
    <text x="820" y="288" class="muted" font-size="14">structured and editable?</text>
  </g>
</svg>