      <text x="1106" y="382" fill="#8B949E" font-size="12" text-anchor="end">small-model structured SVG generation</text>
      <text x="1106" y="406" fill="#5D6674" font-size="10" letter-spacing="1" text-anchor="end">PROMPT → STRUCTURE → EDITABLE OUTPUT</text>

      <path d="M600 508H742L804 536H1106" stroke="#254534"/>
      <circle cx="1106" cy="536" r="4" fill="#3FB950"/>
      <text x="1106" y="512" fill="#F0F6FC" font-size="25" font-weight="700" text-anchor="end">BROWSER DMP</text>
      <text x="1106" y="558" fill="#8B949E" font-size="12" text-anchor="end">behavior / intent / recommendation systems</text>
      <text x="1106" y="582" fill="#5D6674" font-size="10" letter-spacing="1" text-anchor="end">SIGNAL → INTENT → SUGGESTION</text>
