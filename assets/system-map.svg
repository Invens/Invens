    <rect x="464" y="666" width="272" height="48" rx="24" fill="#10161E" stroke="#303946"/>
    <text x="600" y="688" fill="#F0F6FC" font-size="11" text-anchor="middle" letter-spacing="1.6">REPEATING ENGINEERING PATTERN</text>
    <text x="600" y="705" fill="#727B89" font-size="10" text-anchor="middle" letter-spacing="1">observe → decide → act → operate</text>
