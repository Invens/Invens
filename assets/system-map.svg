      <text x="1106" y="224" fill="#5D6674" font-size="10" letter-spacing="1" text-anchor="end">TASK → ROUTE → EXECUTE → CHECK</text>

      <path d="M600 404H740L804 360H1106" stroke="#4C3B22"/>
      <circle cx="1106" cy="360" r="4" fill="#D29922"/>
