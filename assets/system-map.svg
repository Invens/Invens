<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="20" fill="#0A0E13"/>
  <rect x="1" y="1" width="1198" height="758" rx="19" stroke="#262C36"/>

  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
  </defs>

  <g stroke="#141A22">
    <path d="M0 92H1200M0 184H1200M0 276H1200M0 368H1200M0 460H1200M0 552H1200M0 644H1200"/>
    <path d="M100 0V760M200 0V760M300 0V760M400 0V760M500 0V760M600 0V760M700 0V760M800 0V760M900 0V760M1000 0V760M1100 0V760"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="48" y="50" fill="#727B89" font-size="12" letter-spacing="2">SYSTEMS ATLAS / HOW THE WORK CONNECTS</text>
    <text x="1152" y="50" fill="#4D5664" font-size="11" text-anchor="end" letter-spacing="1.5">NOT A PROJECT LIST</text>

    <!-- central spine -->
    <path d="M600 118V642" stroke="url(#line)" stroke-width="2"/>
    <circle cx="600" cy="196" r="7" fill="#58A6FF"/>
    <circle cx="600" cy="300" r="7" fill="#A371F7"/>
    <circle cx="600" cy="404" r="7" fill="#D29922"/>
    <circle cx="600" cy="508" r="7" fill="#3FB950"/>
    <circle cx="600" cy="612" r="7" fill="#58A6FF"/>

    <g font-size="11" letter-spacing="1.5" text-anchor="middle">
      <text x="600" y="166" fill="#58A6FF">INTERFACE</text>
      <text x="600" y="270" fill="#A371F7">CONTEXT</text>
      <text x="600" y="374" fill="#D29922">DECISION</text>
      <text x="600" y="478" fill="#3FB950">EXECUTION</text>
      <text x="600" y="582" fill="#58A6FF">INFRASTRUCTURE</text>
    </g>

    <!-- left systems -->
    <g>
      <path d="M600 196H470L420 156H94" stroke="#2C3B50"/>
      <circle cx="94" cy="156" r="4" fill="#58A6FF"/>
      <text x="94" y="132" fill="#F0F6FC" font-size="25" font-weight="700">ZYLO</text>
      <text x="94" y="178" fill="#8B949E" font-size="12">browser / vpn / privacy / mobile</text>
      <text x="94" y="202" fill="#5D6674" font-size="10" letter-spacing="1">SURFACE → CONTEXT → RECOMMENDATION</text>

      <path d="M600 300H454L392 282H94" stroke="#403552"/>
      <circle cx="94" cy="282" r="4" fill="#A371F7"/>
      <text x="94" y="258" fill="#F0F6FC" font-size="25" font-weight="700">EXPLOREAI</text>
      <text x="94" y="304" fill="#8B949E" font-size="12">discovery / search / seo / content systems</text>
      <text x="94" y="328" fill="#5D6674" font-size="10" letter-spacing="1">INDEX → UNDERSTAND → DISCOVER</text>

      <path d="M600 404H470L420 420H94" stroke="#4C3B22"/>
      <circle cx="94" cy="420" r="4" fill="#D29922"/>
      <text x="94" y="396" fill="#F0F6FC" font-size="25" font-weight="700">SOCIALHUB</text>
      <text x="94" y="442" fill="#8B949E" font-size="12">generation / review / scheduling / publishing</text>
      <text x="94" y="466" fill="#5D6674" font-size="10" letter-spacing="1">CREATE → VERIFY → DISTRIBUTE</text>

      <path d="M600 612H470L420 632H94" stroke="#2C3B50"/>
      <circle cx="94" cy="632" r="4" fill="#58A6FF"/>
      <text x="94" y="608" fill="#F0F6FC" font-size="25" font-weight="700">LOKISURF</text>
      <text x="94" y="654" fill="#8B949E" font-size="12">gaming / discovery / seo infrastructure</text>
      <text x="94" y="678" fill="#5D6674" font-size="10" letter-spacing="1">CONTENT → DELIVERY → OPERATIONS</text>
    </g>

