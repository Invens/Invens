<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <style>
    .paper{fill:#fbfbf8}.ink{fill:#111}.muted{fill:#656565}.rule{stroke:#d9d9d4}.accent{fill:#d94a32}.accentStroke{stroke:#d94a32}
    @media (prefers-color-scheme: dark){.paper{fill:#111214}.ink{fill:#f4f4ef}.muted{fill:#a2a2a0}.rule{stroke:#34363a}.accent{fill:#ff7058}.accentStroke{stroke:#ff7058}}
  </style>
  <rect width="1200" height="520" rx="8" class="paper"/>
  <rect x="1" y="1" width="1198" height="518" rx="7" fill="none" class="rule"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="48" y="48" class="muted" font-size="12" letter-spacing="1.8">ENGINEERING CASEBOOK / SELECTED WORK</text>
    <text x="1150" y="48" class="muted" font-size="12" text-anchor="end">55 builds · 8 areas</text>
    <path d="M48 70H1152" class="rule"/>

    <text x="48" y="154" class="ink" font-size="64" font-weight="750" letter-spacing="-2.4">I like the part</text>
    <text x="48" y="220" class="ink" font-size="64" font-weight="750" letter-spacing="-2.4">after “it works.”</text>

    <text x="50" y="270" class="muted" font-size="18">native state · migrations · fallbacks · data flow · deployment · failure modes</text>

    <rect x="50" y="314" width="314" height="150" rx="3" fill="none" class="rule"/>
    <text x="68" y="340" class="accent" font-size="11" font-weight="700" letter-spacing="1.2">CASE 01 / BROWSER</text>
    <text x="68" y="378" class="ink" font-size="22" font-weight="700">One UI. Two mobile OSes.</text>
    <text x="68" y="408" class="ink" font-size="22" font-weight="700">Multiple VPN states.</text>
    <text x="68" y="442" class="muted" font-size="13">Zylo · Flutter · native bridges · providers</text>

    <rect x="382" y="314" width="314" height="150" rx="3" fill="none" class="rule"/>
    <text x="400" y="340" class="accent" font-size="11" font-weight="700" letter-spacing="1.2">CASE 02 / AI</text>
    <text x="400" y="378" class="ink" font-size="22" font-weight="700">Assume the model fails.</text>
    <text x="400" y="408" class="ink" font-size="22" font-weight="700">Design around it.</text>
    <text x="400" y="442" class="muted" font-size="13">routing · fallback · verification · orchestration</text>

    <rect x="714" y="314" width="438" height="150" rx="3" fill="#111"/>
    <text x="734" y="340" fill="#ff7058" font-size="11" font-weight="700" letter-spacing="1.2">CASE 03 / PRODUCTION</text>
    <text x="734" y="378" fill="#fff" font-size="22" font-weight="700">A database migration is not</text>
    <text x="734" y="408" fill="#fff" font-size="22" font-weight="700">just a database problem.</text>
    <text x="734" y="442" fill="#b8b8b8" font-size="13">MySQL → MongoDB · deployment · plugin timing</text>

    <rect x="1136" y="78" width="16" height="180" class="accent"/>
    <text x="1148" y="292" class="muted" font-size="10" text-anchor="end" letter-spacing="1.3">SELECTED CASES / FULL INDEX BELOW</text>
  </g>
</svg>